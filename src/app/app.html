
<header class="sticky top-0 z-50 w-full border-b border-neutral-200 bg-white/80 backdrop-blur-md">
  <div class="mx-auto flex h-16 items-center justify-between max-w-7xl">

    <div class="flex items-center gap-6">
      @if(isLoggedIn() === true){
      <button (click)="openSidebar()" class="p-2 text-white text-sm rounded-xl shadow-md m-3 ml-0" style="background: linear-gradient(155deg,rgba(55, 164, 219, 1) 0%, rgba(31, 0, 184, 1) 79%);">
        <i class="pi pi-bars mr-2" style="font-size: small;"></i> Menü
      </button>
      }
      <a routerLink="/dashboard" class="flex items-center gap-2 font-bold text-neutral-900 tracking-tight">

        <span class="text-lg">LeBe<span class="text-blue-600 font-medium"> AI</span></span> <span class="text-gray-500 text-sm font-extralight">The future of teaching.</span>
      </a>
    </div>
    @if(isLoggedIn() === true){
    <div class="flex items-center gap-4">
      <div
        class="h-9 w-9 cursor-pointer rounded-full bg-linear-to-br from-orange-400 to-amber-500 p-[2px] ring-2 ring-neutral-100 transition-transform hover:scale-105">
        <div
          class="flex h-full w-full items-center justify-center rounded-full bg-white text-xs font-bold text-neutral-800">
          JK
        </div>
      </div>
    </div>
    }

  </div>
</header>

<main class="mx-auto max-w-7xl">
  <router-outlet></router-outlet>
</main>

<app-menu></app-menu>

@if (isNavigating()) {
    <div @fadeLoader 
         class="fixed inset-0 bg-white/60 dark:bg-surface-950/60 backdrop-blur-xs z-[9999] flex flex-col items-center justify-center pointer-events-auto">
        
        <div class="flex flex-col items-center gap-3 p-6 rounded-xl bg-white dark:bg-surface-900 shadow-xl">
            <i class="pi pi-spin pi-spinner text-4xl text-blue-600"></i>
            
            <span class="text-sm font-medium text-surface-600 dark:text-surface-300 tracking-wide animate-pulse">
                Lädt...
            </span>
        </div>
        
    </div>
}
